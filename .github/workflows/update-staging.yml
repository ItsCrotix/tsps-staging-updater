name: Update TSPS Staging

# Checks RSPSApp/tsps main every 10 minutes. When it has a commit this workflow hasn't sent yet,
# it calls the AMP instance's "Webhook Event Received" trigger, which stops, updates and starts
# the staging world. Each sent commit is remembered as a cache entry, so an unchanged main
# sends nothing.
on:
    schedule:
        - cron: "*/10 * * * *"
    workflow_dispatch:
        inputs:
            force:
                description: Send the update even if this commit was already sent
                type: boolean
                default: false

permissions: {}

concurrency:
    group: tsps-staging
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Read upstream main
              id: main
              run: |
                  sha=$(git ls-remote https://github.com/RSPSApp/tsps.git refs/heads/main | cut -f1)
                  test -n "$sha"
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"
                  echo "upstream main is $sha"

            - name: Check whether it was sent
              id: sent
              uses: actions/cache/restore@v4
              with:
                  path: .sent
                  key: tsps-staging-${{ steps.main.outputs.sha }}
                  lookup-only: true

            - name: Call the AMP webhook
              id: call
              if: steps.sent.outputs.cache-hit != 'true' || inputs.force
              env:
                  AMP_WEBHOOK_URL: ${{ secrets.AMP_WEBHOOK_URL }}
                  AMP_WEBHOOK_TOKEN: ${{ secrets.AMP_WEBHOOK_TOKEN }}
                  SHA: ${{ steps.main.outputs.sha }}
              run: |
                  if [ -z "$AMP_WEBHOOK_URL" ] || [ -z "$AMP_WEBHOOK_TOKEN" ]; then
                      echo "::warning::Add the AMP_WEBHOOK_URL and AMP_WEBHOOK_TOKEN secrets; nothing was sent."
                      exit 0
                  fi
                  # Pasted secrets often end in a newline; neither value may contain whitespace.
                  url=$(printf '%s' "$AMP_WEBHOOK_URL" | tr -d '[:space:]')
                  token=$(printf '%s' "$AMP_WEBHOOK_TOKEN" | tr -d '[:space:]')
                  echo "::add-mask::$token"
                  case "$url" in
                      *'<'* | *'>'*) echo "::error::AMP_WEBHOOK_URL still contains < or >. Put the instance ID in without the brackets."; exit 1 ;;
                      https://*/API/ADSModule/Servers/*/API/WebhookPlugin/TriggerWebhookEvent) ;;
                      *) echo "::error::AMP_WEBHOOK_URL must look like https://<panel>/API/ADSModule/Servers/<instance id>/API/WebhookPlugin/TriggerWebhookEvent (it is ${#url} characters)."; exit 1 ;;
                  esac
                  body=$(jq -n --arg token "$token" --arg sha "$SHA" \
                      '{payload: "update-main", data: $sha, SESSIONID: $token}')
                  # CubeCoders' webhook post names the header "Authorize"; send the standard one too.
                  response=$(curl -sS --fail-with-body -X POST "$url" \
                      -H "Content-Type: application/json" -H "Accept: application/json" \
                      -H "Authorize: Bearer $token" -H "Authorization: Bearer $token" \
                      --data "$body") || { echo "$response"; exit 1; }
                  echo "$response"
                  # AMP answers HTTP 200 with {"Status": false, "Reason": ...} when it refuses.
                  if printf '%s' "$response" | jq -e 'type == "object" and .Status == false' > /dev/null 2>&1; then
                      echo "::error::AMP refused the webhook: $(printf '%s' "$response" | jq -r '.Reason // "no reason given"')"
                      exit 1
                  fi
                  mkdir -p .sent && echo "$SHA" > .sent/sha
                  echo "sent=true" >> "$GITHUB_OUTPUT"

            - name: Remember the commit
              if: steps.call.outputs.sent == 'true' && steps.sent.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: .sent
                  key: tsps-staging-${{ steps.main.outputs.sha }}

            # AMP's stop, update and start take several minutes. Holding the concurrency group
            # makes the next run wait, so a second chain can't start the server mid-update.
            - name: Give AMP time to finish
              if: steps.call.outputs.sent == 'true'
              run: sleep 720
